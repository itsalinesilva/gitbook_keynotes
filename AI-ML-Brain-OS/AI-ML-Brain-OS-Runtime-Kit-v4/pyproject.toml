[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "ai-ml-brain-os-runtime"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
[project.scripts]
brain-os = "brain_os.cli:main"
[tool.setuptools]
package-dir = {"" = "runtime"}
packages = ["brain_os"]
[tool.pytest.ini_options]
pythonpath = ["runtime"]
testpaths = ["runtime/tests"]
addopts = "-q"
[tool.ruff]
line-length = 100
target-version = "py311"
